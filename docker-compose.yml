services:
  web:
    build:
      context: .
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: http://localhost:3001
      INTERNAL_INTAKE_API_URL: ${INTERNAL_INTAKE_API_URL:-}
      PUBLIC_INTAKE_SECRET: ${PUBLIC_INTAKE_SECRET:-}
